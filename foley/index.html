<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OnomaFoley</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: two-panel foley stage. Left = the poem stage (text in, onomatopoeia cards out, 4 engines per card/line/poem).
   Right = the foley console (performance sliders, DMP readout, live scope, 16D inspector). */
:root{
  --bg:#E6EAE5; --panel:#F4F6F2; --raise:#FFFFFF; --ink:#16201B; --muted:#56655D; --line:#C5CEC7;
  --voice:#2C50C2; --phys:#9E5A0B; --cross:#8A2A7A; --tts:#3C4E46; --hot:#C23B22;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --panel:#181F1B; --raise:#1F2722; --ink:#E4EBE6; --muted:#93A399; --line:#2E3933;
    --voice:#86A2FF; --phys:#E2A24E; --cross:#DA7CC9; --tts:#AEBFB6; --hot:#FF6A4D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --panel:#181F1B; --raise:#1F2722; --ink:#E4EBE6; --muted:#93A399; --line:#2E3933;
  --voice:#86A2FF; --phys:#E2A24E; --cross:#DA7CC9; --tts:#AEBFB6; --hot:#FF6A4D; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1260px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;padding-block:6px 16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand h1 b{font-weight:400;color:var(--cross)}
.brand p{margin:8px 0 0;color:var(--muted);font-size:13px;max-width:60ch}
.rec{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.rec .lamp{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .15s}
.rec.on .lamp{background:var(--hot);box-shadow:0 0 0 4px color-mix(in srgb,var(--hot) 22%,transparent)}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,372px);gap:18px;align-items:start}
@media (max-width:940px){.app{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
h2.label{margin-bottom:10px}
textarea{width:100%;min-height:78px;resize:vertical;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--ink)}
textarea:focus-visible{outline:2px solid var(--cross);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chipbtn{font:13px var(--f-body);padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chipbtn:hover{color:var(--ink);border-color:var(--muted)}
.chipbtn:focus-visible,.go:focus-visible{outline:2px solid var(--cross);outline-offset:2px}
.go{font:700 14px var(--f-body);padding:9px 18px;border-radius:8px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.status{font-size:13px;color:var(--muted)}
.status b{color:var(--ink);font-weight:500}
/* engine buttons */
.eb{--c:var(--tts);display:inline-flex;align-items:center;gap:6px;font:500 13px var(--f-body);padding:7px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 9%,var(--raise));color:var(--c);cursor:pointer;white-space:nowrap}
.eb:hover{background:color-mix(in srgb,var(--c) 20%,var(--raise))}
.eb:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.eb[data-mode="voice"]{--c:var(--voice)} .eb[data-mode="phys"]{--c:var(--phys)} .eb[data-mode="cross"]{--c:var(--cross)}
.eb.sm{padding:3px 8px;font-size:13px;gap:0}
.eb.stop{--c:var(--hot)}
.poemhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:4px}
.poemtext{font-family:var(--f-display);font-size:clamp(17px,2.2vw,21px);line-height:1.5;margin:4px 0 10px;color:var(--muted)}
.line{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding-block:14px;border-top:1px dashed var(--line)}
.line-ctrl{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.line-ctrl .ln{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.words{display:flex;flex-wrap:wrap;gap:10px;min-width:0}
.word{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.word:focus-visible{outline:2px solid var(--cross);outline-offset:2px}
.word.sel{border-color:var(--ink)}
.word.live{transform:translateY(-3px);border-color:var(--cross);box-shadow:0 6px 18px -10px var(--cross)}
.wtxt{font-family:var(--f-display);font-size:clamp(26px,4vw,34px);line-height:1.05;display:flex;align-items:center;gap:9px;overflow-wrap:anywhere}
.wtxt i{width:11px;height:11px;border-radius:50%;background:var(--wc);flex:none;box-shadow:0 0 0 1px var(--line)}
.wmeta{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.vec16{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:2px;height:26px;align-items:end;min-width:150px}
.vec16 span{border-radius:1px;min-height:2px}
.g1{background:color-mix(in srgb,var(--ink) 62%,transparent)} .g2{background:var(--phys)} .g3{background:var(--voice)} .g4{background:var(--cross)}
.wbtns{display:flex;gap:4px;flex-wrap:wrap}
@media (max-width:560px){.line{grid-template-columns:minmax(0,1fr)} .line-ctrl{flex-direction:row;align-items:center;flex-wrap:wrap}}
/* console */
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:center;padding-block:7px}
.ctl label{font-weight:500;font-size:14px}
.ctl output{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--cross);margin:4px 0 0}
.ctl .ends{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;padding-block:6px}
.chk input{accent-color:var(--cross);width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips span b{color:var(--ink);font-weight:500}
canvas#scope{width:100%;height:92px;display:block;background:var(--raise);border:1px solid var(--line);border-radius:8px}
.insp-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.insp-word{font-family:var(--f-display);font-size:30px;line-height:1.1}
.insp-sub{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.grp{margin-top:12px}
.grp h3{margin:0 0 4px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.grp h3 i{width:8px;height:8px;border-radius:2px}
.ax{display:grid;grid-template-columns:88px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:12.5px;padding-block:2px}
.ax .nm{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ax .bar{height:6px;background:color-mix(in srgb,var(--line) 70%,transparent);border-radius:3px;overflow:hidden}
.ax .bar span{display:block;height:100%;border-radius:3px}
.ax .val{font-family:var(--f-mono);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px;box-shadow:0 0 0 1px var(--line)}
.mora{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:10px 0 0}
.copyrow{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
#copyFallback{width:100%;min-height:70px;font:11px var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){.word,.rec .lamp{transition:none}.word.live{transform:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Onoma<b>Foley</b></h1>
      <p>短文をオノマトペの詩に変え、16軸の音象徴ベクトルから声・物理衝撃・その交差で効果音を演奏します。</p>
    </div>
    <div class="rec" id="rec"><span class="lamp"></span><span id="recTxt">STANDBY</span></div>
  </header>

  <div class="app">
    <div class="col">
      <section class="panel" aria-labelledby="inLbl">
        <h2 class="label" id="inLbl">Step 1 · テキスト入力</h2>
        <textarea id="src" aria-label="短文またはオノマトペ文">激しい雨が降り、雷が轟いて地面が揺れた</textarea>
        <div class="row" style="margin-top:10px;justify-content:space-between">
          <button class="go" id="convert">詩に変換</button>
          <span class="status" id="status"></span>
        </div>
        <div class="examples" id="examples"></div>
      </section>

      <section class="panel" aria-labelledby="poemLbl">
        <div class="poemhead">
          <h2 class="label" id="poemLbl" style="margin:0">Step 2–4 · オノマトペ詩とフォーリー演奏</h2>
          <div class="row" id="poemBtns"></div>
        </div>
        <p class="poemtext" id="poemText"></p>
        <div id="lines"></div>
      </section>
    </div>

    <aside class="col">
      <section class="panel" aria-labelledby="ctlLbl">
        <h2 class="label" id="ctlLbl">Foley console</h2>
        <div class="ctl">
          <label for="vocal">Vocalness</label><output id="vocalO"></output>
          <input type="range" id="vocal" min="0" max="1" step="0.01" value="0.5">
          <div class="ends"><span>物理 0.0</span><span>V=0.5 で完全融合</span><span>1.0 声</span></div>
        </div>
        <div class="ctl">
          <label for="stiff">Stiffness（アタック硬さ）</label><output id="stiffO"></output>
          <input type="range" id="stiff" min="0" max="1" step="0.01" value="0.6">
          <div class="ends"><span>t<sub>c</sub> 3.0 ms</span><span>0.5 ms</span></div>
        </div>
        <div class="ctl">
          <label for="tempo">Tempo</label><output id="tempoO"></output>
          <input type="range" id="tempo" min="0.6" max="1.6" step="0.01" value="1">
        </div>
        <div class="ctl">
          <label for="room">Room（残響）</label><output id="roomO"></output>
          <input type="range" id="room" min="0" max="1" step="0.01" value="0.22">
        </div>
        <div class="ctl">
          <label for="vol">Volume</label><output id="volO"></output>
          <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
        </div>
        <label class="chk"><input type="checkbox" id="subk" checked> 初拍 Sub-Kick（40–80 Hz ピッチダイブ）</label>
        <canvas id="scope" aria-label="出力波形スコープ"></canvas>
        <h2 class="label" style="margin:14px 0 8px">Dynamic Modulation Profile</h2>
        <div class="chips" id="dmp"></div>
      </section>

      <section class="panel" aria-labelledby="inspLbl">
        <h2 class="label" id="inspLbl">OnomaDict 16D inspector</h2>
        <div id="insp"></div>
        <div class="copyrow">
          <button class="chipbtn" id="copyJson">詩のベクトルを JSON でコピー</button>
          <span class="status" id="copyMsg"></span>
        </div>
        <textarea id="copyFallback" hidden readonly aria-label="JSON"></textarea>
      </section>
    </aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* =====================================================================
   0. Constants: Dynamic Modulation Profile (DMP)
   ===================================================================== */
const DMP = {
  swing_ratio: 0.58,          // 畳語スイング 58:42
  second_decay_ratio: 0.65,   // 畳語2音目の振幅比（減衰抑制）
  sokuon_charge_ms: 18.0,     // 促音「っ」の Hertz 弾性無音チャージ
  delta_f0_slope_hz: -260.0,  // 句末ピッチブレーキ（初期勾配 Hz/s）
  accent_sub_kick: [40, 80]   // 初拍 Sub-Kick 下限/上限 Hz
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;

/* =====================================================================
   1. Kana -> mora parser
   ===================================================================== */
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const KROWS = {"":"アイウエオ",k:"カキクケコ",g:"ガギグゲゴ",s:"サシスセソ",z:"ザジズゼゾ",t:"タチツテト",d:"ダヂヅデド",
  n:"ナニヌネノ",h:"ハヒフヘホ",b:"バビブベボ",p:"パピプペポ",m:"マミムメモ",y:"ヤ・ユ・ヨ",r:"ラリルレロ",w:"ワヰ・ヱヲ"};
const KMAP = {};
for (const [c, row] of Object.entries(KROWS)) [...row].forEach((ch, i) => { if (ch !== "・") KMAP[ch] = [c, "aiueo"[i]]; });
Object.assign(KMAP, {"シ":["sh","i"],"チ":["ch","i"],"ツ":["ts","u"],"フ":["f","u"],"ジ":["j","i"],"ヂ":["j","i"],"ヅ":["z","u"],"ヴ":["v","u"]});
// consonant classes: P voiceless plosive, A affricate, B voiced plosive, F fricative, Z voiced fricative, M nasal, L liquid, G glide, V none
const CCLASS = {"":"V",k:"P",t:"P",p:"P",ch:"A",ts:"A",g:"B",d:"B",b:"B",s:"F",sh:"F",h:"F",f:"F",z:"Z",j:"Z",v:"Z",m:"M",n:"M",N:"M",r:"L",y:"G",w:"G"};

function parseMora(word) {
  const s = toKata(word), out = [];
  for (const ch of s) {
    if (ch === "ッ") { out.push({type:"Q", c:"", v:""}); continue; }
    if (ch === "ン") { out.push({type:"N", c:"N", v:"N"}); continue; }
    if ("ー〜～".includes(ch)) { const p = [...out].reverse().find(m => m.v); out.push({type:"R", c:"", v: p ? p.v : "a"}); continue; }
    const sm = "ァィゥェォャュョ".indexOf(ch);
    if (sm >= 0) {
      const v = "aiueoauo"[sm], prev = out[out.length - 1];
      if (prev && prev.type === "M") { prev.v = v; if (sm >= 5) prev.pal = true; }
      else out.push({type:"M", c: sm >= 5 ? "y" : "", v});
      continue;
    }
    const m = KMAP[ch];
    if (!m) continue;
    const prev = out[out.length - 1];
    // vowel-only mora repeating the previous vowel = long vowel (ゴオオ)
    if (m[0] === "" && prev && prev.v === m[1] && prev.type !== "Q") { out.push({type:"R", c:"", v:m[1]}); continue; }
    out.push({type:"M", c:m[0], v:m[1]});
  }
  for (let i = 0; i < out.length - 1; i++) if (out[i].type === "Q") out[i + 1].afterQ = true;
  return out;
}
function findRedup(ms) {
  const key = ms.map(m => m.type + m.c + m.v), n = key.length;
  for (let p = 1; p <= n / 2; p++) {
    if (n % p) continue;
    let ok = true;
    for (let i = p; i < n && ok; i++) if (key[i] !== key[i % p]) ok = false;
    if (ok) return {unit: p, count: n / p};
  }
  return null;
}

/* =====================================================================
   2. OnomaDict 16D vector (phonosemantic derivation + overrides)
   ===================================================================== */
// per consonant class: [weight, sudden, indirect, hard, moist, turbulence]
const CF = {P:[.35,.85,.2,.85,.15,.2],A:[.35,.7,.4,.7,.35,.5],B:[.85,.8,.25,.75,.25,.25],F:[.2,.3,.8,.15,.6,.8],
  Z:[.7,.35,.75,.35,.6,.9],M:[.45,.2,.4,.2,.45,.1],L:[.5,.4,.7,.3,.4,.4],G:[.3,.25,.6,.1,.7,.2],V:[.35,.3,.5,.15,.4,.2]};
// per vowel: [weightΔ, brightness, hardΔ, moistΔ, hue°]
const VFX = {a:[.1,.55,.05,0,18],i:[-.15,1,.15,-.05,52],u:[-.05,.3,-.1,.15,215],e:[0,.7,0,0,135],o:[.15,.15,0,.05,268],N:[.1,.2,-.1,.1,300]};
const OVR = {
  "キラキラ":{material:"metal",temp:-1},"ピカッ":{material:"metal"},"パリン":{material:"metal"},"ガシャーン":{material:"metal"},
  "チリン":{material:"metal"},"カーン":{material:"metal"},"ゴーン":{material:"metal"},"キーン":{material:"metal",temp:-3},
  "ドカン":{material:"membrane"},"ズドン":{material:"membrane"},"ドカーン":{material:"membrane"},"ドンドン":{material:"membrane"},
  "ゴロゴロ":{material:"membrane"},"ズシン":{material:"membrane"},"ドスン":{material:"membrane"},"ドキドキ":{material:"membrane",temp:1},
  "バクバク":{material:"membrane",temp:2},"ボン":{material:"membrane"},
  "ポタポタ":{material:"liquid"},"ピチャン":{material:"liquid"},
  "ザブーン":{material:"liquid"},"ゴクゴク":{material:"liquid"},"バシャ":{material:"liquid"},
  "バシャバシャ":{material:"liquid"},"チャプチャプ":{material:"liquid"},"ザザー":{material:"liquid"},"ポロポロ":{material:"liquid"},
  "ガタガタ":{material:"wood"},"トントン":{material:"wood"},"コツコツ":{material:"wood"},"チクタク":{material:"wood"},
  "カリカリ":{material:"wood"},"バタン":{material:"wood"},"ガチャ":{material:"metal"},"カチャ":{material:"metal"},
  "メラメラ":{temp:3},"ジリジリ":{temp:3},"ギラギラ":{temp:3},"ゴウゴウ":{temp:2},"ポカポカ":{temp:2},"ジュージュー":{temp:3},"ジュー":{temp:3},
  "ザーザー":{material:"liquid",temp:-1},"ポツポツ":{material:"liquid",temp:-1},"シトシト":{material:"liquid",temp:-1},"ヒヤッ":{temp:-3},"ヒンヤリ":{temp:-2},"シンシン":{temp:-3},"ヒュー":{temp:-1},"ビュービュー":{temp:-2},"シーン":{temp:-1}
};
const MAT = {
  wood:    {r:[1,2.76,5.40,8.93], d:[1,.55,.32,.18], tau:.16, name:"木材", fk:.6},
  membrane:{r:[1,1.59,2.14,2.30,2.65,2.92], d:[1,.7,.55,.45,.35,.3], tau:.32, name:"膜", fk:.25},
  metal:   {r:[1,1.47,2.09,2.56,2.98,3.53,4.13,4.87,5.44,6.21], d:[1,.92,.85,.8,.74,.7,.64,.6,.55,.5], tau:1.0, name:"金属", fk:.9},
  liquid:  {r:[1,1.83,2.95], d:[1,.5,.3], tau:.05, name:"液体", fk:.8}
};
function hslHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
  return "#" + [f(0), f(8), f(4)].map(x => x.toString(16).padStart(2, "0")).join("").toUpperCase();
}
function deriveVector(kata, moras, redup) {
  const M = moras.filter(m => m.type === "M" || m.type === "N");
  const has = t => moras.some(m => m.type === t);

    {name:"Phrasing", cls:"g4", ax:[["Accent", "", v.Accent.toFixed(2)], ["Contour", "下降 ↔ 上昇", (v.Contour >= 0 ? "+" : "") + v.Contour.toFixed(2)], ["Meter", "", v.Meter + " 拍"], ["Regularity", "", v.Regularity.toFixed(2)]]}
  ];
  const plan = planWord(e, opts, true);
  const tc = lerp(3.0, 0.5, clamp(opts.stiffness * 0.75 + v.Hardness * 0.25));
  let k = 0;
  $("insp").innerHTML = `
    <div class="insp-head"><span class="insp-word">${esc(e.text)}</span><span class="insp-sub">${MAT[e.material].name} · t<sub>c</sub> ${tc.toFixed(2)} ms · ${(plan.dur * 1000).toFixed(0)} ms</span></div>
    <div class="mora">${moraLabel(e)}</div>
    ${G.map(g => `<div class="grp"><h3><i class="${g.cls}"></i>${g.name}</h3>${g.ax.map(a => { const x = n[k++]; return `
      <div class="ax" title="${a[1]}"><span class="nm">${a[0]}</span><span class="bar"><span class="${g.cls}" style="width:${Math.round(x * 100)}%;${a[0] === "Color_Hex" ? "background:" + v.Color_Hex : ""}"></span></span><span class="val">${a[2]}</span></div>`; }).join("")}</div>`).join("")}
    <p class="note">${e.redup ? `畳語 ${e.redup.count}回: スイング ${Math.round(DMP.swing_ratio * 100)}:${Math.round(100 - DMP.swing_ratio * 100)}、2音目 ×${DMP.second_decay_ratio}、BBD ${(plan.unitLen * 1000).toFixed(0)} ms。` : "畳語ではないのでスイングなし。"}
    ${e.moras.some(m => m.type === "Q") ? `促音: ${DMP.sokuon_charge_ms} ms チャージ後に x<sup>1.5</sup> ブースト。` : ""}
    句末では f0 が ${DMP.delta_f0_slope_hz} Hz/s で下降。</p>`;
}
function renderDMP() {
  $("dmp").innerHTML = [["swing", `${Math.round(DMP.swing_ratio * 100)}:${Math.round(100 - DMP.swing_ratio * 100)}`], ["2nd", "×" + DMP.second_decay_ratio],
    ["sokuon", DMP.sokuon_charge_ms + " ms · F∝x^1.5"], ["Δf0", DMP.delta_f0_slope_hz + " Hz/s"], ["sub-kick", DMP.accent_sub_kick.join("–") + " Hz"]]
    .map(([a, b]) => `<span>${a} <b>${b}</b></span>`).join("");
}
function select(l, w) {
  sel = [l, w];
  document.querySelectorAll(".word.sel").forEach(x => x.classList.remove("sel"));
  const el = $(`w-${l}-${w}`); if (el) el.classList.add("sel");
  renderInspector();
}
function itemsFor(scope, l, w) {
  if (scope === "word") return [{l, w, phraseEnd:true, phraseStart:true}];
  const lines = scope === "line" ? [l] : poem.map((_, i) => i);
  const items = [];
  for (const li of lines) poem[li].forEach((_, wi) => items.push({l: li, w: wi, phraseStart: wi === 0, phraseEnd: wi === poem[li].length - 1, lineEnd: wi === poem[li].length - 1}));
  return items;
}
function speak(text) {
  if (!("speechSynthesis" in window)) { toast("このブラウザでは音声読み上げ（Web Speech API）が使えません"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP"; u.rate = opts.tempo;
  const jv = speechSynthesis.getVoices().find(x => /^ja/i.test(x.lang)); if (jv) u.voice = jv;
  u.onstart = () => setRec(true, "TTS"); u.onend = () => setRec(false);
  u.onerror = () => { setRec(false); toast("読み上げを開始できませんでした。日本語音声がない可能性があります"); };
  speechSynthesis.speak(u);
}
let recTimer = null;
function setRec(on, label) { $("rec").classList.toggle("on", on); $("recTxt").textContent = on ? "REC · " + label : "STANDBY"; }
function perform(mode, scope, l, w) {
  if (scope === "word") select(l, w);
  const items = itemsFor(scope, l, w);
  if (mode === "tts") {
    const txt = scope === "word" ? poem[l][w].text : (scope === "line" ? [l] : poem.map((_, i) => i)).map(i => poem[i].map(e => e.text).join(" ")).join("、");
    speak(txt); return;
  }
  const {ctx, master} = audio();
  const bus = ctx.createGain(); bus.connect(master); active.add(bus);
  let t = ctx.currentTime + 0.06, end = t;
  const label = {voice:"ENGINE A", phys:"ENGINE B", cross:"CROSS-FOLEY V=" + opts.vocalness.toFixed(2)}[mode];
  setRec(true, label);
  for (const it of items) {
    const entry = poem[it.l][it.w];
    const plan = planWord(entry, opts, it.phraseEnd);
    end = Math.max(end, scheduleWord(ctx, bus, entry, plan, t, mode, opts, it.phraseStart));
    const delay = (t - ctx.currentTime) * 1000, id = `w-${it.l}-${it.w}`;
    setTimeout(() => { const el = $(id); if (el) { el.classList.add("live"); setTimeout(() => el.classList.remove("live"), Math.max(160, plan.dur * 1000)); } }, delay);
    t += plan.dur + (0.06 + (1 - entry.vec.Time) * 0.08) / opts.tempo + (it.lineEnd ? 0.32 / opts.tempo : 0);
  }
  clearTimeout(recTimer);
  recTimer = setTimeout(() => setRec(false), (t - ctx.currentTime) * 1000 + 200);
  setTimeout(() => { try { bus.disconnect(); } catch (e) {} active.delete(bus); }, (end - ctx.currentTime + 3) * 1000);
}
function stopAll() {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (AC) for (const b of active) b.gain.setTargetAtTime(0, AC.ctx.currentTime, 0.03);
  setRec(false);
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }

function drawScope() {
  const cv = $("scope"), g = cv.getContext("2d"), buf = new Float32Array(2048);
  const cs = getComputedStyle(document.documentElement);
  const frame = () => {
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    g.strokeStyle = cs.getPropertyValue("--line").trim(); g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
    if (AC) {
      AC.an.getFloatTimeDomainData(buf);
      g.strokeStyle = cs.getPropertyValue("--cross").trim(); g.lineWidth = 1.5; g.beginPath();
      for (let i = 0; i < buf.length; i++) { const x = i / (buf.length - 1) * w, y = h / 2 - buf[i] * h * 0.46; i ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke();
    }
    requestAnimationFrame(frame);
  };
  frame();
}

// wiring
[["vocal","vocalness",v => v.toFixed(2)],["stiff","stiffness",v => lerp(3, .5, v).toFixed(2) + " ms"],["tempo","tempo",v => "×" + v.toFixed(2)],["room","room",v => Math.round(v * 100) + "%"],["vol","volume",v => Math.round(v * 100) + "%"]]
  .forEach(([id, key, fmt]) => {
    const el = $(id), o = $(id + "O");
    const upd = () => { opts[key] = +el.value; o.textContent = fmt(opts[key]); applyMix(); if (key === "stiffness" || key === "tempo") renderInspector(); };
    el.addEventListener("input", upd); upd();
  });
$("subk").addEventListener("change", e => opts.subKick = e.target.checked);
$("convert").addEventListener("click", convert);
$("src").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) convert(); });
$("examples").innerHTML = EXAMPLES.map((x, i) => `<button class="chipbtn" data-ex="${i}">${esc(x.replace("\n", " / "))}</button>`).join("");
$("examples").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (!b) return; $("src").value = EXAMPLES[+b.dataset.ex]; convert(); });
document.addEventListener("click", e => {
  if (e.target.closest("#stopBtn")) { stopAll(); return; }
  const b = e.target.closest("[data-mode]");
  if (b) { perform(b.dataset.mode, b.dataset.scope, +b.dataset.l, +b.dataset.w); return; }
  const card = e.target.closest(".word");
  if (card) select(+card.dataset.l, +card.dataset.w);
});
document.addEventListener("keydown", e => {
  const card = e.target.closest && e.target.closest(".word");
  if (card && e.target === card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(+card.dataset.l, +card.dataset.w); perform("cross", "word", +card.dataset.l, +card.dataset.w); }
});
$("copyJson").addEventListener("click", () => {
  const json = JSON.stringify({dmp: DMP, poem: poem.map(l => l.map(e => ({text: e.text, material: e.material, redup: e.redup, vec: e.vec})))}, null, 1);
  const fb = () => { const ta = $("copyFallback"); ta.hidden = false; ta.value = json; ta.select(); $("copyMsg").textContent = "選択済み · Ctrl+C でコピー"; };
  try { navigator.clipboard.writeText(json).then(() => $("copyMsg").textContent = "コピーしました", fb); } catch (err) { fb(); }
});
if ("speechSynthesis" in window) speechSynthesis.getVoices();
renderDMP();
convert();
</script>
